name: appsmith-cd  # Workflow name

on:
  push:
    branches:
      - master  # Trigger on push to master branch

jobs:
  deploy-appsmith:
    runs-on: ubuntu-latest  # Run on Ubuntu

    steps:
      - run: curl --location --fail-early --request POST https://yard.demo.appsmith.com/api/v1/git/applications/68a47a9dd0b8bb03282a338a/deploy?refName=master --header ''
